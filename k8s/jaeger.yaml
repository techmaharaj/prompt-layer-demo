# Jaeger all-in-one, in-memory. Component 5 is the one that has to be SEEN:
# "five decisions on one trace" is an argument you can read in a terminal and
# only believe in a trace view.
#
# Fixed NodePorts so the ports never move between runs:
#   30686 -> Jaeger UI
#   30318 -> OTLP/HTTP, which is where the layer sends spans
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: prompt-layer-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/part-of: prompt-layer-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
            # Small enough for a 4GB VM; this is a demo, not a backend.
            - name: MEMORY_MAX_TRACES
              value: "2000"
          ports:
            - { name: ui,   containerPort: 16686 }
            - { name: otlp, containerPort: 4318 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
  labels:
    app.kubernetes.io/part-of: prompt-layer-demo
spec:
  type: NodePort
  selector: { app: jaeger }
  ports:
    - { name: ui,   port: 16686, targetPort: 16686, nodePort: 30686 }
    - { name: otlp, port: 4318,  targetPort: 4318,  nodePort: 30318 }
